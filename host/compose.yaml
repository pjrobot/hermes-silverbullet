# SilverBullet, Hermes Agent and qmd sharing one notes space, on one host.
#
# A minimal layout to adapt, not a hardened deployment. SilverBullet is bound to
# loopback: put your own reverse proxy (and TLS) in front of it to reach it
# from a phone.

services:
  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:${SILVERBULLET_VERSION}
    restart: unless-stopped
    # Not PUID/PGID: the published image runs the binary directly and reads
    # neither, so without this it runs as root and writes root-owned pages.
    user: "${SPACE_UID}:${SPACE_GID}"
    ports:
      # Loopback only. Docker's published ports bypass host firewalls like
      # ufw, so "0.0.0.0" here would expose your notes to the LAN as-is.
      - "127.0.0.1:3000:3000"
    volumes:
      # A LOCAL directory. inotify on this is what makes agent writes appear
      # live in the editor.
      - ${SPACE_DIR}:/space
    environment:
      # Plugs can run shell commands in the container when this is enabled --
      # not something an editor the agent also writes to needs.
      SB_SHELL_BACKEND: "off"
      # Required: an empty SB_USER means no login at all.
      SB_USER: ${SB_USER:?set SB_USER to username:password}

  hermes:
    image: nousresearch/hermes-agent:${HERMES_VERSION}
    restart: unless-stopped
    command: gateway run
    volumes:
      - ${HERMES_DATA_DIR}:/opt/data
      - ${SPACE_DIR}:/notes
      # Only for `terminal.backend: docker` -- see hermes-config.snippet.yaml.
      # Root-equivalent on the host; read the Hermes docs before adding it.
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PUID: "${SPACE_UID}"
      PGID: "${SPACE_GID}"
      # The image sets this to /opt/data alone, which hard-blocks write_file
      # and patch on /notes. Keep /opt/data or the agent loses its own state.
      HERMES_WRITE_SAFE_ROOT: "/opt/data:/tmp:/notes"
    networks:
      - default
      - search

  qmd:
    build: ./qmd
    container_name: qmd
    restart: unless-stopped
    # No ports: qmd's endpoints are unauthenticated, so being reachable only
    # from the `search` network is the access control.
    volumes:
      - ${SPACE_DIR}:/notes:ro
      # A directory, seeded once from qmd/index.yml: qmd rewrites its config
      # in place (it appends a models: block), so it must not be the copy in
      # this repo.
      - ${QMD_CONFIG_DIR}:/config
      - qmd-cache:/cache
    environment:
      # --host 0.0.0.0 disables qmd's Host-header check; this re-enables it.
      QMD_ALLOWED_HOSTS: "qmd,qmd:8181,localhost,localhost:8181"
    networks:
      - search

networks:
  # Not `internal`: qmd downloads its models on first boot.
  search:

volumes:
  # ~2GB of GGUF models; kept out of the image so a rebuild doesn't re-pull.
  qmd-cache:
